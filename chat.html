<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czat Transakcji</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full h-[85vh] bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
        
        <div class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center">
            <div>
                <span class="text-xs font-bold text-yellow-500 uppercase tracking-widest">Transakcja zabezpieczona</span>
                <h1 id="chatItemTitle" class="text-lg font-black truncate">Nazwa przedmiotu...</h1>
                <p class="text-xs text-slate-400">Sprzedawca: <span id="chatSellerName" class="text-slate-200 font-semibold">...</span></p>
            </div>
            <div class="flex gap-2">
                <a href="czaty.html" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-1">
                    💬 Wszystkie czaty
                </a>
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition-all">Sklep</a>
            </div>
        </div>

        <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-900/50">
        </div>

        <form id="messageForm" class="p-4 bg-slate-950 border-t border-slate-800 flex gap-3">
            <input type="text" id="messageInput" required placeholder="Napisz wiadomość do drugiej strony..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500 text-sm">
            <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold px-6 rounded-xl transition-colors text-sm uppercase tracking-wider">
                Wyślij
            </button>
        </form>
    </div>

    <script>
        // Sprawdzanie zalogowania
        const currentUser = localStorage.getItem('user_nick');
        if (!currentUser) {
            alert('Musisz być zalogowany!');
            window.location.href = 'logowanie.html';
        }

        // Pobieranie danych transakcji
        const itemTitle = localStorage.getItem('chat_item_title') || 'Przedmiot';
        const itemSeller = localStorage.getItem('chat_item_seller') || 'Sprzedawca';
        
        document.getElementById('chatItemTitle').innerText = itemTitle;
        document.getElementById('chatSellerName').innerText = itemSeller;

        // Klucz czatu w LocalStorage przypisany do tej konkretnej pary i przedmiotu
        const chatKey = `chat_cache_${itemSeller}_${itemTitle}`;

        const messagesContainer = document.getElementById('messagesContainer');

        // FUNKCJA RENDERUJĄCA WIADOMOŚCI
        function renderMessages() {
            const history = JSON.parse(localStorage.getItem(chatKey)) || [];
            messagesContainer.innerHTML = ''; // czyszczenie okna

            if (history.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="text-center text-slate-500 text-xs py-8 italic">
                        Rozpoczęto czat. Napisz wiadomość, aby uzgodnić warunki odbioru przedmiotu w grze!
                    </div>
                `;
                return;
            }

            history.forEach(msg => {
                const isMe = msg.sender === currentUser;
                
                // Stylizacja dymka w zależności od tego, czy piszemy my, czy ktoś inny
                const alignment = isMe ? 'justify-end' : 'justify-start';
                const bubbleColor = isMe ? 'bg-yellow-500 text-slate-950 font-medium' : 'bg-slate-800 text-white';
                const roundedStyle = isMe ? 'rounded-br-none' : 'rounded-bl-none';

                const msgHtml = `
                    <div class="flex ${alignment}">
                        <div class="max-w-[75%]">
                            <p class="text-[10px] text-slate-500 mb-0.5 px-1">${msg.sender}</p>
                            <div class="${bubbleColor} ${roundedStyle} px-4 py-2.5 rounded-2xl text-sm shadow-md break-all">
                                ${msg.text}
                            </div>
                        </div>
                    </div>
                `;
                messagesContainer.innerHTML += msgHtml;
            });

            // Autoscroll na dół przy nowej wiadomości
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // OBSŁUGA WYSYŁANIA
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            let history = JSON.parse(localStorage.getItem(chatKey)) || [];
            
            history.push({
                sender: currentUser,
                text: text
            });

            localStorage.setItem(chatKey, JSON.stringify(history));

            // Zapisujemy ten czat na globalnej liście aktywnych konwersacji
            let activeChats = JSON.parse(localStorage.getItem('active_chats_list')) || [];
            const chatExists = activeChats.some(c => c.key === chatKey);
            
            if (!chatExists) {
                activeChats.push({
                    key: chatKey,
                    title: itemTitle,
                    seller: itemSeller,
                    buyer: currentUser // osoba, która zainicjowała czat (kupujący)
                });
                localStorage.setItem('active_chats_list', JSON.stringify(activeChats));
            }

            input.value = ''; 
            renderMessages(); 
        });

        // LIVE ODŚWIEŻANIE CO 1 SEKUNDĘ (druga strona widzi wiadomości na żywo)
        setInterval(renderMessages, 1000);

        // Pierwsze ładowanie widoku
        renderMessages();
    </script>
</body>
</html>
