<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaloguj się</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border text-white font-medium px-6 py-4 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50 flex items-center gap-3">
        <span id="toastIcon"></span>
        <span id="toastMessage"></span>
    </div>

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <h2 class="text-3xl font-black text-center text-yellow-500 mb-6 uppercase tracking-wide">LOGOWANIE</h2>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Nick z Robloxa</label>
                <input type="text" id="loginNick" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Hasło</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
            </div>
            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 rounded-xl transition-colors mt-6">
                Zaloguj się
            </button>
        </form>
        
        <p class="text-center text-sm text-slate-400 mt-4">Nie masz konta? <a href="rejestracja.html" class="text-yellow-500 font-semibold hover:underline">Zarejestruj się</a></p>
    </div>

<script>
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMessage.innerText = message;
            
            if (type === 'success') {
                toast.className = toast.className.replace(/border-.*/, 'border-green-500');
                toastIcon.innerText = '✅';
            } else {
                toast.className = toast.className.replace(/border-.*/, 'border-red-500');
                toastIcon.innerText = '❌';
            }
            
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputNick = document.getElementById('loginNick').value.trim();
            const inputPass = document.getElementById('loginPassword').value;

            // 1. SPRAWDZANIE STAŁEGO KONTA ADMINA
            if (inputNick === "Admin" && inputPass === "Admin123!") {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user_nick', 'Admin');
                showToast('Zalogowano jako Administrator!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                return;
            }

            // 2. SPRAWDZANIE W BAZIE WSZYSTKICH UŻYTKOWNIKÓW
            const usersList = JSON.parse(localStorage.getItem('registered_users')) || [];
            
            // Szukamy użytkownika, u którego zgadza się login i hasło
            const foundUser = usersList.find(user => user.username === inputNick && user.password === inputPass);

            if (foundUser) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user_nick', foundUser.username); // zapisujemy sesję danego użytkownika
                showToast('Zalogowano pomyślnie! Wracasz na stronę...', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } else {
                showToast('Błędny nick lub hasło!', 'error');
            }
        });
    </script>
</body>
</html>
