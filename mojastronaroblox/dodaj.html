<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wystaw Przedmiot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex items-center justify-center p-6">

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-green-500 text-white font-medium px-6 py-4 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50 flex items-center gap-3">
        <span>📦</span>
        <span id="toastMessage">Przedmiot został wystawiony!</span>
    </div>

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-yellow-500 uppercase tracking-wide">Wystaw skin / walutę</h2>
            <a href="index.html" class="text-sm text-slate-400 hover:text-white">Anuluj</a>
        </div>
        
        <form id="addItemForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Nazwa przedmiotu</label>
                <input type="text" id="itemName" required placeholder="np. Dark Bringer, 500 Robux" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Wybierz grę</label>
                <select id="itemGame" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
                    <option value="MM2">MM2</option>
                    <option value="Jailbreak">Jailbreak</option>
                    <option value="Brainrot">Brainrot</option>
                    <option value="Robuxy">Robuxy</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Cena (PLN)</label>
                <input type="number" id="itemPrice" required placeholder="0.00" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-3 rounded-xl transition-colors mt-6">
                Opublikuj ogłoszenie
            </button>
        </form>
    </div>

    <script>
        // Sprawdzamy na start, czy użytkownik jest zalogowany
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('Musisz być zalogowany, aby wystawiać przedmioty!');
            window.location.href = 'logowanie.html';
        }

        document.getElementById('addItemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('itemName').value;
            const game = document.getElementById('itemGame').value;
            const price = parseFloat(document.getElementById('itemPrice').value).toFixed(2);
            const seller = localStorage.getItem('user_nick') || 'Anonim';

            // Tworzymy obiekt nowego przedmiotu
            const newItem = {
                id: Date.now().toString(), // unikalne ID oparte na czasie
                title: name,
                game: game,
                price: price,
                seller: seller
            };

            // Pobieramy stare przedmioty z pamięci lub tworzymy pustą tablicę
            let currentItems = JSON.parse(localStorage.getItem('custom_items')) || [];
            
            // Dodajemy nasz nowy przedmiot na początek listy
            currentItems.unshift(newItem);
            
            // Zapisujemy zaktualizowaną listę w pamięci przeglądarki
            localStorage.setItem('custom_items', JSON.stringify(currentItems));

            // Pokazujemy ładny Toast
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
